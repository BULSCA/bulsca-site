name: API tests

on:
  push:
    branches: ['CODEX/**']
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: bulsca_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bulsca_test
      DB_USERNAME: root
      DB_PASSWORD: testing
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: dom, mbstring, pdo_mysql, intl, zip, curl, xml, fileinfo
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check PHP syntax
        run: find app tests database/factories -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite Unit
      - name: Public API and diagnostics feature tests
        run: vendor/bin/phpunit tests/Feature/Api
